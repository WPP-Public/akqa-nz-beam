name: CI

on: [push]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer:v2
    - name: Install dependencies
      run: |
        for attempt in 1 2 3; do
          composer install --no-interaction --no-progress && break
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          echo "composer install failed (attempt $attempt), retrying in 15 seconds..."
          sleep 15
        done
    - name: PHPUnit tests
      uses: php-actions/phpunit@v3
      with:
        version: "9"

  build-phar:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
    - uses: actions/checkout@v3
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer:v2
    - name: Install dependencies
      run: |
        for attempt in 1 2 3; do
          composer install --no-interaction --no-progress && break
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          echo "composer install failed (attempt $attempt), retrying in 15 seconds..."
          sleep 15
        done
    - name: Build phar
      run: php -d phar.readonly=0 bin/compile
    - name: Upload beam.phar
      uses: actions/upload-artifact@v4
      with:
        name: beam-phar
        path: |
          beam.phar
          beam.phar.version
